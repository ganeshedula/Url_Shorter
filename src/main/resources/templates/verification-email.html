<html lang="en"><body style="margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1c1c1e">

      <tr><td style="padding:32px;text-align:center"><div style="font-size:15px;font-weight:700;color:#007aff;letter-spacing:.08em">NEXLY</div>

      <div style="font-size:32px;font-weight:700;letter-spacing:10px;background:#f2f2f7;padding:18px 12px;border-radius:12px">{{otp}}</div>

      </td></tr></table>
  </td></tr></table>
